[build-system]
requires = ["setuptools"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "survey-pipeline"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.32.0",
    "pandas>=2.0.0",
    "plotly>=5.0.0",
    "pyarrow>=14.0.0",
    "kaleido>=0.2.1",
    "fpdf2>=2.7.0",
    "groq>=0.5.0",
    "python-dotenv>=1.0.0",
    "streamlit-extras>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
exclude = [".venv*", ".cache*"]
