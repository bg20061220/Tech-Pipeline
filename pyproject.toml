[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tech-pipeline"
version = "0.1.0"
description = "Survey & Transcript Analysis Pipeline"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.32.0",
    "pandas>=2.0.0",
    "plotly>=5.0.0",
    "pyarrow>=14.0.0",
    "kaleido>=0.2.1",
    "fpdf2>=2.7.0",
    "groq>=0.5.0",
    "python-dotenv>=1.0.0",
    "streamlit-extras>=0.3.0",
    "streamlit-js-eval>=0.1.0",
]

[project.scripts]
tech-pipeline = "tech_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tech_pipeline*"]

[tool.setuptools.package-data]
tech_pipeline = [".streamlit/config.toml"]
